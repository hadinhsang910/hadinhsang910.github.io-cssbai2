<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Rectangles</title>
  <style>
    .outer {
      border: 3px dotted blue;
      border-radius: 15px;
      padding: 15px;
      background-color: #f9f9f9;
    }
    .middle {
      border: 3px dashed red;
      border-radius: 15px;
      padding: 15px;
      background-color: #fff;
    }
    .inner {
      border: 3px solid green;
      border-radius: 15px;
      padding: 25px;
      text-align: center;
      font-size: 28px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="outer">
    <div class="middle">
      <div class="inner">
        I am heavily packed<br><DIV>
      </div>
    </div>
  </div>
</body>
</html>
